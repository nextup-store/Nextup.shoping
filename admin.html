<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nextup Admin</title><link rel="stylesheet" href="admin.css"></head><body>
<div id="login" class="screen"><div class="login-card"><div class="logo">N</div><p class="eyebrow">NEXTUP ADMIN</p><h1>Store Control</h1><p>Private dashboard for products and orders.</p><input id="adminEmail" type="email" placeholder="Admin email"><input id="adminPassword" type="password" placeholder="Password"><button id="loginBtn">Sign in</button><small id="loginMsg"></small></div></div>
<div id="app" class="hidden"><aside><div class="side-brand"><b>N</b><span>nextup</span></div><button class="nav active" data-page="dashboard">Dashboard</button><button class="nav" data-page="products">Products</button><button class="nav" data-page="orders">Orders</button><button class="nav" data-page="settings">Settings</button><button id="logoutBtn" class="logout">Log out</button></aside><main><header><div><p class="eyebrow">ADMIN PANEL</p><h2 id="pageTitle">Dashboard</h2></div><a href="../index.html" target="_blank">View store ↗</a></header><section id="dashboard" class="page active"><div class="stats"><div><span>Products</span><strong id="statProducts">0</strong></div><div><span>Orders</span><strong id="statOrders">0</strong></div><div><span>Low stock</span><strong id="statLow">0</strong></div></div><div class="panel"><h3>Quick actions</h3><div class="actions"><button data-page="products" class="accent">+ Add product</button><button data-page="orders">View orders</button></div></div></section><section id="products" class="page"><div class="toolbar"><h3>Products</h3><button id="newProduct" class="accent">+ Add Product</button></div><div id="productList" class="product-list"></div></section><section id="orders" class="page"><div class="toolbar"><h3>Orders</h3><button id="refreshOrders">Refresh</button></div><div id="orderList" class="orders"></div></section><section id="settings" class="page"><div class="panel form"><h3>Store settings</h3><label>WhatsApp<input id="setWa" value="01618472120"></label><label>Facebook<input id="setFb" value="https://www.facebook.com/nextup01"></label><label>Instagram<input id="setIg" value="https://www.instagram.com/next.up01/"></label><label>Dhaka/Sylhet delivery<input id="setLocal" type="number" value="70"></label><label>Outside delivery<input id="setOther" type="number" value="120"></label><button id="saveSettings" class="accent">Save settings</button><small id="settingsMsg"></small></div></section></main></div>
<div id="productModal" class="modal"><div class="modal-card"><button class="x" data-close>×</button><h3 id="formTitle">Add Product</h3><form id="productForm"><input type="hidden" id="pid"><label>Product name<input id="pname" required></label><label>Brand / Model<input id="pmodel"></label><div class="two"><label>Old price<input id="pold" type="number" min="0"></label><label>New price<input id="pprice" type="number" min="0" required></label></div><div class="two"><label>Stock<input id="pstock" type="number" min="0"></label><label>Colors<input id="pcolors" placeholder="Black, Grey"></label></div><label>Description<textarea id="pdesc"></textarea></label><label>Product images<input id="pimages" type="file" accept="image/*" multiple><small>Multiple images allowed. Secure image storage is enabled after Supabase setup.</small></label><div id="preview" class="preview"></div><button class="accent" type="submit">Save product</button><small id="formMsg"></small></form></div></div><script src="admin.js"></script></body></html>
